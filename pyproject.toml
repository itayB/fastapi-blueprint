[project]
name = "fastapi-blueprint"
version = "0.1.0"
description = "FastAPI service template"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]==0.162.0",
    "pydantic-settings==2.16.2",
]

[dependency-groups]
dev = [
    "prek==0.5.9",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
