[project]
name = "fastapi-blueprint"
version = "0.0.0"
description = "FastAPI service template"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
  "fastapi[standard]==0.162.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "commitizen==4.19.3",
  "deptry==0.25.1",
  "mypy==2.4.1",
  "prek==0.5.9",
  "pyproject-fmt==2.30.3",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
  "shellcheck-py==0.11.0.1",
  "vulture==2.16",
  "yamllint==1.38.0",
]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = [ "B", "E", "F", "I", "PLC2701", "RUF", "SIM", "SLF001", "UP", "W" ]
explicit-preview-rules = true
preview = true

[tool.deptry]
known_first_party = [ "app", "scripts" ]

[tool.vulture]
paths = [ "app", "scripts" ]
ignore_names = [ "model_config", "status_code" ]
ignore_decorators = [ "@router.*" ]

[tool.pyproject-fmt]
keep_full_version = true
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"

[tool.mypy]
files = [ "app", "scripts", "tests" ]
explicit_package_bases = true
strict = true
plugins = [ "pydantic.mypy" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
pythonpath = [ "." ]
addopts = "--color=yes --import-mode=importlib --cov --cov-report=term-missing"
filterwarnings = [ "error" ]
strict = true

[tool.coverage.run]
source = [ "app", "scripts" ]
branch = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
major_version_zero = true
tag_format = "v$version"
